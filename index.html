<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>@fisshhfilet</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overscroll-behavior:none}
body{font-family:"Courier New",Courier,monospace;-webkit-font-smoothing:antialiased;overflow:hidden}
#feed{width:100vw;height:100dvh;overflow-y:scroll;overflow-x:hidden;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;background:#000}
.page{position:relative;width:100vw;height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
.page img,.page video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
.hotlink{position:absolute;inset:0;z-index:5;display:block;background:transparent;-webkit-tap-highlight-color:transparent}
#original-opening{position:fixed;inset:0;z-index:9999;background:#000;display:flex;align-items:center;justify-content:center;pointer-events:none}
#original-opening span{color:#d6d6d6;font-size:11px;letter-spacing:0.22em;opacity:0;font-weight:400;text-transform:lowercase}
#original-opening.go span{animation:origIn 0.6s ease forwards 0.15s,origOut 0.5s ease forwards 1.25s}
@keyframes origIn{from{opacity:0}to{opacity:0.9}}@keyframes origOut{from{opacity:0.9}to{opacity:0}}
#finalPage{background:#000}
#finalPage video#gomfVideo{position:absolute;inset:0;z-index:1}
#doors{position:absolute;inset:0;z-index:2;display:flex;pointer-events:none}
.door{width:50.1%;height:100%;background:#000;will-change:transform;transform:translateX(0);transition:transform 1.55s cubic-bezier(0.77,0,0.175,1)}
#doors.open.door-left{transform:translateX(-100%)}
#doors.open.door-right{transform:translateX(100%)}
#privateOverlay{position:absolute;inset:0;z-index:3;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;pointer-events:none;opacity:1;transition:opacity 0.7s ease}
#privateOverlay.hide{opacity:0}
.pa-line{opacity:0;will-change:opacity;transition:opacity 0.9s ease;text-align:center;line-height:1}
.pa-line.show{opacity:1}
#pa-fisshh{color:#d6d6d6;font-size:11px;letter-spacing:0.22em;margin-bottom:18px}
#pa-private{color:#2d6a4f;font-size:12px;letter-spacing:0.32em;margin-bottom:22px}
#pa-members{color:#3a3a3a;font-size:9px;letter-spacing:0.28em}
</style>
</head>
<body>
<div id="original-opening"><span>@fisshhfilet</span></div>
<div id="feed">
  <section class="page"><img src="betty.jpg" alt=""><a class="hotlink" href="https://www.instagram.com/club52vogue.shop/" target="_blank" rel="noopener"></a></section>
  <section class="page"><img src="waista.jpg" alt=""><a class="hotlink" href="https://www.instagram.com/club52vogue.shop/" target="_blank" rel="noopener"></a></section>
  <section class="page"><img src="restocking-fisshhfilet.jpg" alt=""><a class="hotlink" href="https://www.instagram.com/club52vogue.shop/" target="_blank" rel="noopener"></a></section>

  <section class="page"><img src="adults-only.jpg" alt=""><a class="hotlink" href="https://www.instagram.com/club52vogue.shop/" target="_blank" rel="noopener"></a></section>
  <section class="page" data-video="1"><video id="rhudeVideo" src="RHUDE.mp4" playsinline muted loop preload="auto" disablepictureinpicture controlslist="nodownload noplaybackrate nofullscreen" webkit-playsinline></video><a class="hotlink" href="https://www.instagram.com/club52vogue.shop/" target="_blank" rel="noopener"></a></section>
  <section class="page"><img src="mc.jpg" alt=""><a class="hotlink" href="https://www.instagram.com/club52vogue.shop/" target="_blank" rel="noopener"></a></section>
  <section class="page" data-video="1"><video id="liquidVideo" src="liquid.mp4" playsinline muted loop preload="auto" disablepictureinpicture controlslist="nodownload noplaybackrate nofullscreen" webkit-playsinline></video><a class="hotlink" href="https://www.liquid-iv.com" target="_blank" rel="noopener"></a></section>
  <section class="page"><img src="kalshi.jpg" alt=""><a class="hotlink" href="https://kalshi.com" target="_blank" rel="noopener"></a></section>
  <section class="page"><img src="boatbear.jpg" alt=""><a class="hotlink" href="https://naturalcatchtuna.com/" target="_blank" rel="noopener"></a></section>
  <section class="page" id="finalPage" data-video="1">
    <video id="gomfVideo" src="GOMF.mp4" playsinline muted loop preload="auto" disablepictureinpicture controlslist="nodownload noplaybackrate nofullscreen" webkit-playsinline></video>
    <div id="doors"><div class="door door-left"></div><div class="door door-right"></div></div>
    <div id="privateOverlay"><div id="pa-fisshh" class="pa-line">@fisshhfilet</div><div id="pa-private" class="pa-line">PRIVATE ACCESS</div><div id="pa-members" class="pa-line">MEMBERS ONLY</div></div>
    <a class="hotlink" id="finalHotlink" href="https://www.instagram.com/club52vogue.shop/" target="_blank" rel="noopener" style="z-index:4;pointer-events:none"></a>
  </section>
</div>
<script>
(function(){
  const feed=document.getElementById('feed');
  const pages=[...document.querySelectorAll('.page')];
  const opening=document.getElementById('original-opening');
  const allVideos=[...document.querySelectorAll('video')];
  requestAnimationFrame(()=>{opening.classList.add('go');setTimeout(()=>{opening.style.display='none'},2000)});
  let finalTimers=[],finalState='idle';
  const privateOverlay=document.getElementById('privateOverlay');
  const doors=document.getElementById('doors');
  const paFisshh=document.getElementById('pa-fisshh');
  const paPrivate=document.getElementById('pa-private');
  const paMembers=document.getElementById('pa-members');
  const finalHotlink=document.getElementById('finalHotlink');
  const gomfVideo=document.getElementById('gomfVideo');
  function clearFinal(){finalTimers.forEach(t=>clearTimeout(t));finalTimers=[]}
  function resetFinal(){
    clearFinal();finalState='idle';
    privateOverlay.classList.remove('hide');doors.classList.remove('open');
    paFisshh.classList.remove('show');paPrivate.classList.remove('show');paMembers.classList.remove('show');
    doors.style.transition='none';void doors.offsetWidth;doors.style.transition='';
    try{gomfVideo.pause();gomfVideo.currentTime=0}catch(e){}
    finalHotlink.style.pointerEvents='none';
    paFisshh.style.transition='';paPrivate.style.transition='';paMembers.style.transition='';
  }
  function startFinal(){
    if(finalState!=='idle')return;resetFinal();finalState='running';
    finalTimers.push(setTimeout(()=>paFisshh.classList.add('show'),500));
    finalTimers.push(setTimeout(()=>paPrivate.classList.add('show'),1000));
    finalTimers.push(setTimeout(()=>paMembers.classList.add('show'),1500));
    finalTimers.push(setTimeout(()=>{
      paFisshh.style.transition=paPrivate.style.transition=paMembers.style.transition='opacity 0.6s ease';
      paFisshh.classList.remove('show');paPrivate.classList.remove('show');paMembers.classList.remove('show');
      finalTimers.push(setTimeout(()=>{
        privateOverlay.classList.add('hide');finalState='doorsOpening';
        finalTimers.push(setTimeout(()=>{
          doors.classList.add('open');
          finalTimers.push(setTimeout(()=>{
            finalState='revealed';
            try{gomfVideo.currentTime=0;gomfVideo.muted=true;gomfVideo.play().catch(()=>{})}catch(e){}
            finalHotlink.style.pointerEvents='auto';
          },1550));
        },200));
      },650));
    },5000));
  }
  function pauseAll(){allVideos.forEach(v=>{try{v.pause()}catch(e){}})}
  function playFrom0(v){if(!v)return;try{v.pause();v.currentTime=0;v.muted=true;v.play().catch(()=>{})}catch(e){}}
  function settledIdx(){const h=window.innerHeight||800;return Math.max(0,Math.min(Math.round(feed.scrollTop/h),pages.length-1))}
  let last=-1;
  function onSettled(i){
    if(i===last)return;const prev=last;last=i;
    if(prev===10&&i!==10)resetFinal();
    pauseAll();
    if(i===10){startFinal();return}
    const pg=pages[i];
    if(pg&&pg.getAttribute('data-video')){
      const vid=pg.querySelector('video');
      setTimeout(()=>{if(settledIdx()!==i)return;playFrom0(vid)},60);
    }
  }
  let t=null;feed.addEventListener('scroll',()=>{clearTimeout(t);t=setTimeout(()=>onSettled(settledIdx()),120)},{passive:true});
  window.addEventListener('resize',()=>{clearTimeout(t);t=setTimeout(()=>onSettled(settledIdx()),120)});
  setTimeout(()=>onSettled(settledIdx()),2100);
  allVideos.forEach(v=>{v.muted=true;v.playsInline=true;v.setAttribute('playsinline','');v.setAttribute('muted','');try{v.disablePictureInPicture=true}catch(e){}});
})();
</script>
</body>
</html>
