<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"
>

<title>FISSHHFILET</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
}

body{
  background:#000;
}


/* =====================================================
   ORIGINAL APP OPENING
===================================================== */

#intro{
  position:fixed;
  inset:0;
  z-index:1000;

  background:#000;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#fff;

  font-family:Menlo,Monaco,Consolas,monospace;

  font-size:11px;
  letter-spacing:.35em;

  opacity:1;

  transition:opacity .6s ease;

  pointer-events:none;
}

#intro.hide{
  opacity:0;
}


/* =====================================================
   MAIN FEED
===================================================== */

#viewport{
  width:100vw;
  height:100dvh;

  overflow-y:auto;
  overflow-x:hidden;

  background:#000;

  scroll-snap-type:y mandatory;
  scroll-snap-stop:always;

  -webkit-overflow-scrolling:touch;

  overscroll-behavior-y:none;

  scrollbar-width:none;

  touch-action:pan-y;
}

#viewport::-webkit-scrollbar{
  display:none;
}


/* =====================================================
   PAGES
===================================================== */

.page{
  position:relative;

  width:100vw;
  height:100dvh;
  min-height:100dvh;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#000;

  overflow:hidden;

  scroll-snap-align:start;
}


/* =====================================================
   MEDIA
===================================================== */

.page img,
.page video{
  display:block;

  width:100%;
  height:100%;

  object-fit:contain;

  background:#000;

  user-select:none;
  -webkit-user-select:none;

  -webkit-user-drag:none;

  pointer-events:none;
}


/* =====================================================
   INVISIBLE INSTAGRAM LINK
===================================================== */

.ig-cam{
  position:absolute;

  left:40%;
  top:38%;

  width:20%;
  height:24%;

  z-index:20;

  display:block;

  background:transparent;

  pointer-events:auto;
}


/* =====================================================
   INVISIBLE BOAT BEAR LINK
===================================================== */

.arrow-box{
  position:absolute;

  top:2%;
  right:2%;

  width:14%;
  height:8%;

  z-index:20;

  background:transparent;

  pointer-events:auto;
}


/* =====================================================
   LAST VIDEO — PRIVATE ACCESS
===================================================== */

.private-page{
  position:relative;
}


/* -----------------------------------------------------
   PRIVATE ACCESS SCREEN
----------------------------------------------------- */

.private-access{
  position:absolute;
  inset:0;

  z-index:50;

  background:#000;

  display:flex;
  align-items:center;
  justify-content:center;

  opacity:1;

  pointer-events:none;

  transition:
    opacity 1.1s cubic-bezier(.22,.61,.36,1);
}


/* -----------------------------------------------------
   PRIVATE ACCESS TEXT
----------------------------------------------------- */

.private-copy{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  text-align:center;

  opacity:0;

  transform:translateY(4px);

  transition:
    opacity 1s ease,
    transform 1s ease;
}

.private-access.show .private-copy{
  opacity:1;
  transform:translateY(0);
}


/* -----------------------------------------------------
   STOCK / KALSHI GREEN
----------------------------------------------------- */

.private-title{
  color:#42d36f;

  font-family:
    Menlo,
    Monaco,
    Consolas,
    monospace;

  font-size:10px;

  letter-spacing:.34em;

  padding-left:.34em;

  text-transform:uppercase;
}

.private-sub{
  margin-top:15px;

  color:rgba(255,255,255,.38);

  font-family:
    Menlo,
    Monaco,
    Consolas,
    monospace;

  font-size:7px;

  letter-spacing:.27em;

  padding-left:.27em;
}


/* -----------------------------------------------------
   THE DOOR
----------------------------------------------------- */

.private-door{
  position:absolute;
  inset:0;

  z-index:60;

  pointer-events:none;

  display:flex;

  overflow:hidden;
}


/* LEFT HALF */

.door-left,
.door-right{
  position:relative;

  width:50%;
  height:100%;

  background:#000;

  transition:
    transform 1.35s cubic-bezier(.77,0,.175,1);
}


/* subtle luxury seam */

.door-left::after,
.door-right::after{
  content:"";

  position:absolute;

  top:0;
  bottom:0;

  width:1px;

  background:rgba(255,255,255,.035);
}

.door-left::after{
  right:0;
}

.door-right::after{
  left:0;
}


/* OPEN */

.private-page.open .door-left{
  transform:translateX(-100%);
}

.private-page.open .door-right{
  transform:translateX(100%);
}


/* =====================================================
   HIDE PRIVATE ACCESS AFTER OPEN
===================================================== */

.private-page.open .private-access{
  opacity:0;
}


/* =====================================================
   NO LINK BUBBLES
===================================================== */

</style>

</head>

<body>


<!-- =====================================================
     ORIGINAL OPENING
===================================================== -->

<div id="intro">
  @fisshhfilet
</div>


<!-- =====================================================
     FEED
===================================================== -->

<main id="viewport">


  <!-- =================================================
       01 BETTY
  ================================================== -->

  <section class="page">

    <img
      src="betty.jpg?v=30"
      alt=""
      draggable="false"
    >

  </section>


  <!-- =================================================
       02 WAISTA
  ================================================== -->

  <section class="page">

    <img
      src="waista.jpg?v=30"
      alt=""
      draggable="false"
    >

  </section>


  <!-- =================================================
       03 RESTOCKING
  ================================================== -->

  <section class="page">

    <a
      class="ig-cam"
      href="https://www.instagram.com/club52vogue.shop/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Instagram"
    ></a>

    <img
      src="restocking-fisshhfilet.jpg?v=30"
      alt=""
      draggable="false"
    >

  </section>


  <!-- =================================================

  ================================================== -->

  <section class="page">

    <video
      src="Sephora.mp4?v=30"
      playsinline

      preload="auto"
      disablepictureinpicture
      controlslist="nodownload noplaybackrate"
    ></video>

  </section>


  <!-- =================================================
       05 ADULTS ONLY
  ================================================== -->

  <section class="page">

    <img
      src="adults-only.jpg?v=30"
      alt=""
      draggable="false"
    >

  </section>


  <!-- =================================================
       06 RHUDE
  ================================================== -->

  <section class="page">

    <video
      src="RHUDE.mp4?v=30"
      playsinline
      preload="metadata"
      disablepictureinpicture
      controlslist="nodownload noplaybackrate"
    ></video>

  </section>


  <!-- =================================================
       07 MC
  ================================================== -->

  <section class="page">

    <img
      src="mc.jpg?v=30"
      alt=""
      draggable="false"
    >

  </section>


  <!-- =================================================
       08 LIQUID IV
  ================================================== -->

  <section
    class="page"
    data-link="https://www.liquid-iv.com"
  >

    <video
      src="liquid.mp4?v=30"
      playsinline
      muted
      loop
      preload="metadata"
      disablepictureinpicture
      controlslist="nodownload noplaybackrate"
    ></video>

  </section>


  <!-- =================================================
       09 KALSHI
  ================================================== -->

  <section
    class="page"
    data-link="https://kalshi.com"
  >

    <img
      src="kalshi.jpg?v=30"
      alt=""
      draggable="false"
    >

  </section>


  <!-- =================================================
       10 BOAT BEAR
  ================================================== -->

  <section
    class="page"
    data-link="https://naturalcatchtuna.com/"
  >

    <a
      class="arrow-box"
      href="https://naturalcatchtuna.com/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Natural Catch Tuna"
    ></a>

    <img
      src="boatbear.jpg?v=30"
      alt=""
      draggable="false"
    >

  </section>


  <!-- =================================================
       11 FINAL VIDEO
       PRIVATE ACCESS
  ================================================== -->

  <section class="page private-page">

    <video
      src="GOMF.mp4?v=30"
      playsinline
      muted
      preload="auto"
      disablepictureinpicture
      controlslist="nodownload noplaybackrate"
    ></video>


    <!-- PRIVATE ACCESS -->

    <div class="private-access">

      <div class="private-copy">

        <div class="private-title">
          PRIVATE ACCESS
        </div>

        <div class="private-sub">
          MEMBERS ONLY
        </div>

      </div>

    </div>


    <!-- DOOR -->

    <div class="private-door">

      <div class="door-left"></div>

      <div class="door-right"></div>

    </div>

  </section>


</main>


<script>

/* =====================================================
   FISSHHFILET
   SIMPLE / STABLE / NATIVE
===================================================== */

const viewport =
  document.getElementById("viewport");

const intro =
  document.getElementById("intro");

const pages =
  Array.from(
    document.querySelectorAll(".page")
  );

const videos =
  Array.from(
    document.querySelectorAll("video")
  );

const finalPage =
  document.querySelector(".private-page");


/* =====================================================
   ORIGINAL OPENING
===================================================== */

setTimeout(() => {

  if(!intro){
    return;
  }

  intro.classList.add("hide");

  setTimeout(() => {

    if(
      intro &&
      intro.parentNode
    ){

      intro.remove();

    }

  },650);

},900);


/* =====================================================
   VIDEO ENGINE
=====================================================

   IMPORTANT:

   No IntersectionObserver.

   No scrollIntoView.

   No forced scrolling.

   No custom swipe navigation.

   Native Android scrolling controls the feed.
===================================================== */

let activeVideo = null;

let scrollTimer = null;


/* =====================================================
   FIND CURRENT PAGE
===================================================== */

function currentPage(){

  const h =
    viewport.clientHeight;

  if(!h){
    return null;
  }

  let index =
    Math.round(
      viewport.scrollTop / h
    );


  index =
    Math.max(
      0,
      Math.min(
        pages.length - 1,
        index
      )
    );


  return pages[index];

}


/* =====================================================
   STOP ALL OTHER VIDEOS
===================================================== */

function stopOtherVideos(video){

  videos.forEach(v => {

    if(v !== video){

      v.pause();

    }

  });

}


/* =====================================================
   START CURRENT VIDEO
===================================================== */

function startCurrentVideo(){

  const page =
    currentPage();


  if(!page){
    return;
  }


  const video =
    page.querySelector("video");


  if(!video){

    stopOtherVideos(null);

    activeVideo = null;

    return;

  }


  stopOtherVideos(video);

  activeVideo = video;


  /*
    IMPORTANT:

    Every time a video page becomes the
    selected page after a swipe, restart it.

    This restores the original FISSHHFILET
    behavior.

    Sephora specifically starts from
    the beginning after every swipe.
  */

  video.currentTime = 0;


  video.play().catch(
    () => {}
  );

}


/* =====================================================
   SCROLL SETTLE
===================================================== */

viewport.addEventListener(
  "scroll",
  () => {

    clearTimeout(scrollTimer);


    scrollTimer =
      setTimeout(() => {

        startCurrentVideo();

      },220);

  },
  {
    passive:true
  }
);


/* =====================================================
   INITIAL VIDEO
===================================================== */

setTimeout(() => {

  startCurrentVideo();

},300);


/* =====================================================
   FINAL PRIVATE ACCESS
===================================================== */

let finalOpened = false;

let finalTimer = null;


/*
   Watch the final page without controlling
   scrolling.
*/

function checkFinalPage(){

  const page =
    currentPage();


  if(page !== finalPage){

    return;

  }


  if(finalOpened){

    return;

  }


  finalOpened = true;


  /*
    Show private access immediately.
  */

  finalPage
    .querySelector(".private-access")
    .classList.add("show");


  /*
    Hold the black/private-access moment
    for approximately 3.5 seconds.
  */

  finalTimer =
    setTimeout(() => {

      finalPage.classList.add(
        "open"
      );


      /*
        Give the door time to open.
      */

      setTimeout(() => {

        const access =
          finalPage.querySelector(
            ".private-access"
          );

        if(access){

          access.classList.remove(
            "show"
          );

        }

      },1100);

    },3500);

}


/* =====================================================
   FINAL PAGE CHECK
===================================================== */

viewport.addEventListener(
  "scroll",
  () => {

    clearTimeout(
      viewport._finalTimer
    );


    viewport._finalTimer =
      setTimeout(
        checkFinalPage,
        260
      );

  },
  {
    passive:true
  }
);


/* =====================================================
   VISIBILITY
===================================================== */

document.addEventListener(
  "visibilitychange",
  () => {

    if(document.hidden){

      videos.forEach(video => {

        video.pause();

      });

      return;

    }


    /*
      When returning to the site,
      start the current page again.

      This intentionally returns video
      pages to their beginning.
    */

    setTimeout(() => {

      startCurrentVideo();

    },150);

  }
);


/* =====================================================
   EXTERNAL WHOLE-PAGE LINKS
===================================================== */

let tapX = 0;
let tapY = 0;
let tapTime = 0;


viewport.addEventListener(
  "touchstart",
  event => {

    const t =
      event.touches[0];

    tapX =
      t.clientX;

    tapY =
      t.clientY;

    tapTime =
      Date.now();

  },
  {
    passive:true
  }
);


viewport.addEventListener(
  "touchend",
  event => {

    const t =
      event.changedTouches[0];


    const dx =
      Math.abs(
        t.clientX - tapX
      );


    const dy =
      Math.abs(
        t.clientY - tapY
      );


    const duration =
      Date.now() - tapTime;


    /*
      Moving finger = swipe.

      NEVER open a link.
    */

    if(
      dx > 15 ||
      dy > 15
    ){

      return;

    }


    /*
      Long press = not tap.
    */

    if(duration > 400){

      return;

    }


    /*
      Real anchor handles itself.
    */

    if(
      event.target.closest("a")
    ){

      return;

    }


    const page =
      event.target.closest(".page");


    if(!page){
      return;
    }


    const link =
      page.dataset.link;


    if(link){

      window.open(
        link,
        "_blank",
        "noopener,noreferrer"
      );

    }

  },
  {
    passive:true
  }
);


/* =====================================================
   IMAGE DRAG
===================================================== */

document
  .querySelectorAll("img")
  .forEach(img => {

    img.addEventListener(
      "dragstart",
      event => {

        event.preventDefault();

      }
    );

  });


/* =====================================================
   VIDEO SETTINGS
===================================================== */

videos.forEach(video => {

  video.controls = false;


  video.addEventListener(
    "contextmenu",
    event => {

      event.preventDefault();

    }
  );

});

</script>

</body>
</html>
