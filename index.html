<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FISSHHFILET</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;background:#000;overflow:hidden}
#intro{position:fixed;inset:0;z-index:30;background:#000;display:flex;align-items:center;justify-content:center;color:#fff;font-family:Menlo,monospace;letter-spacing:.35em;font-size:11px}
#viewport{height:100dvh;width:100vw;overflow-y:auto;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;background:#000}
.page{height:100dvh;width:100vw;scroll-snap-align:start;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;background:#000;position:relative}
.page img,.page video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
.link-hint{position:absolute;bottom:4%;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.15);backdrop-filter:blur(10px);color:#fff;font-family:Menlo,monospace;font-size:10px;letter-spacing:.2em;padding:6px 12px;border-radius:20px;opacity:0;transition:opacity.3s}
.page[data-link].link-hint{opacity:1}
.ig-cam{position:absolute;left:40%;top:38%;width:20%;height:24%;z-index:5}
</style>
</head>
<body>
<div id="intro">@fisshhfilet</div>
<div id="viewport">
<section class="page"><img src="betty.jpg?v=19"></section>
<section class="page"><img src="waista.jpg?v=19"></section>
<section class="page"><a class="ig-cam" href="https://www.instagram.com/club52vogue.shop/" target="_blank"></a><img src="restocking-fisshhfilet.jpg?v=19"></section>
<section class="page"><video src="Sephora.mp4?v=19" playsinline muted loop></video></section>
<section class="page"><img src="adults-only.jpg?v=19"></section>
<section class="page"><video src="RHUDE.mp4?v=19" playsinline preload="auto"></video></section>
<section class="page"><img src="mc.jpg?v=19"></section>

<!-- LIQUID IVY - tap anywhere to go to liquid-iv.com -->
<section class="page" data-link="https://www.liquid-iv.com">
<img src="liquid.mp4?v=19" onerror="this.outerHTML='<video src=liquid.mp4?v=19 playsinline muted loop></video>'">
<div class="link-hint">TAP TO SHOP LIQUID I.V. →</div>
</section>

<!-- KALSHI - tap anywhere to go to kalshi.com -->
<section class="page" data-link="https://kalshi.com">
<img src="kalshi.jpg?v=19">
<div class="link-hint">TAP TO TRADE ON KALSHI →</div>
</section>

<!-- BEAR - fixed, tap to go to club52vogue -->
<section class="page" data-link="https://www.instagram.com/club52vogue.shop/">
<img src="boatbear.jpg?v=19">
<div class="link-hint">BOAT BEAR → SHOP</div>
</section>

<section class="page"><video src="GOMF.mp4?v=19" playsinline preload="auto"></video></section>
</div>
<script>
const viewport=document.getElementById('viewport');
const intro=document.getElementById('intro');
setTimeout(()=>{intro.style.opacity='0';setTimeout(()=>intro.remove(),600);},900);
const io=new IntersectionObserver(es=>{
 es.forEach(e=>{
  const v=e.target.querySelector('video');
  if(!v) return;
  if(e.isIntersecting){ if(v.src.includes('Sephora')) v.currentTime=0.5; v.muted=false; v.play().catch(()=>{v.muted=true;v.play();}); } else v.pause();
 });
},{threshold:0.6});
document.querySelectorAll('.page').forEach(p=>io.observe(p));

let sy=0,t0=0;
viewport.addEventListener('touchstart',e=>{sy=e.touches[0].clientY;t0=Date.now();},{passive:true});
viewport.addEventListener('touchend',e=>{
 if(Math.abs(e.changedTouches[0].clientY-sy)>30) return;
 if(Date.now()-t0>400) return;
 const page=e.target.closest('.page');
 const link=page?.dataset?.link;
 if(link &&!e.target.closest('a')) window.open(link,'_blank');
},{passive:true});
</script>
</body>
 </html>
