<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>fisshhfilet.github.io</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overscroll-behavior:none}
body{font-family:ui-monospace,Menlo,Monaco,monospace;overflow:hidden;background:#000}
#feed{width:100vw;height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;background:#000}
.page{width:100vw;height:100dvh;scroll-snap-align:start;background:#000;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;overflow:hidden}
.page img,.page video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
.tap{position:absolute;inset:0;z-index:5}
#shopPage{background:#000}
#shopFrame{width:100%;height:100%;border:0;background:#000;display:block}
.opening{position:absolute;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:2;animation:fadeOutOpening 1.2s ease 2.2s forwards}
.opening span{color:#bbb;font-size:10px;letter-spacing:.32em;opacity:0;animation:fadeIn .8s ease .4s forwards}
@keyframes fadeIn{to{opacity:.7}}
@keyframes fadeOutOpening{to{opacity:0;pointer-events:none}}
.final{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;text-align:center}
</style>
</head>
<body>
<div id="feed">

<!-- 0 OPENING @fisshhfilet small text fades into betty -->
<section class="page" style="background:#000">
<div class="opening"><span>@fisshhfilet</span></div>
<img src="betty.jpg" loading="eager" style="opacity:0;animation:fadeIn 1.1s ease 2s forwards">
<a class="tap" href="https://instagram.com/fisshhfilet" target="_blank"></a>
</section>

<!-- 1 BETTY -->
<section class="page"><img src="betty.jpg" loading="eager"><a class="tap" href="https://instagram.com/fisshhfilet" target="_blank"></a></section>

<!-- 2 WAISTA -->
<section class="page"><img src="waista.jpg" loading="lazy"><a class="tap" href="https://instagram.com/fisshhfilet" target="_blank"></a></section>

<!-- 3 BEAR-BOAT-HOODIE moved to 4th -->
<section class="page"><img src="bear-boat-hoodie.jpg" loading="lazy"><a class="tap" href="https://naturalcatchtuna.com/" target="_blank"></a></section>

<!-- 4 SEPHORA VIDEO -->
<section class="page"><video src="Sephora.mp4" autoplay muted loop playsinline preload="auto" poster="betty.jpg"></video><a class="tap" href="https://instagram.com/fisshhfilet" target="_blank"></a></section>

<!-- 5 QR-WARE -->
<section class="page"><img src="qr-ware.jpg" loading="lazy"><a class="tap" href="https://instagram.com/fisshhfilet" target="_blank"></a></section>

<!-- 6 HAKRS-FLIP -->
<section class="page"><img src="hakrs-flip.jpg" loading="lazy"><a class="tap" href="https://instagram.com/fisshhfilet" target="_blank"></a></section>

<!-- 7 SHOP.HTML -->
<section class="page" id="shopPage"><iframe id="shopFrame" src="shop.html" loading="lazy" title="shop"></iframe></section>

<!-- 8 RESTOCKING-SOON-FIX -->
<section class="page"><img src="restocking-soon-fix.jpg" loading="lazy"><a class="tap" href="https://instagram.com/fisshhfilet" target="_blank"></a></section>

<!-- 9 WAISTA-QUESTION -->
<section class="page"><img src="waista-question.jpg" loading="lazy"><a class="tap" href="https://instagram.com/fisshhfilet" target="_blank"></a></section>

<!-- 10 KALSHI-TRADE -->
<section class="page"><img src="kalshi-trade.jpg" loading="lazy"><a class="tap" href="https://kalshi.com" target="_blank"></a></section>

<!-- 11 ADULTS-ONLY-BEACH -->
<section class="page"><img src="adults-only-beach.jpg" loading="lazy"><a class="tap" href="https://instagram.com/fisshhfilet" target="_blank"></a></section>

<!-- 12 @fisshhfilet small text font -->
<section class="page final" style="background:#000"><div style="color:#a8a8a8;font-size:10px;letter-spacing:.32em">@fisshhfilet</div></section>

<!-- 13 PRIVATE ACCESS in white -->
<section class="page final" style="background:#000"><div style="color:#fff;font-size:11px;letter-spacing:.36em;font-weight:500">PRIVATE ACCESS</div></section>

<!-- 14 MEMBERS ONLY in Kalshi green -->
<section class="page final" style="background:#000"><div style="color:#39e66f;font-size:10px;letter-spacing:.32em;font-weight:800">MEMBERS ONLY</div></section>

</div>
</body>
</html>
