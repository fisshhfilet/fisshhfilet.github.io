<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"
>

<title>FISSHHFILET</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
}

body{
  overscroll-behavior:none;
}


/* =====================================================
   PRIVATE ACCESS INTRO
===================================================== */

#intro{
  position:fixed;
  inset:0;
  z-index:9999;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#000;
  color:#fff;

  font-family:
    Menlo,
    Monaco,
    Consolas,
    monospace;

  font-size:11px;
  letter-spacing:.38em;

  opacity:1;

  transition:
    opacity .55s ease;

  pointer-events:none;
}

#intro.hide{
  opacity:0;
}


/* =====================================================
   ACCESS TEXT
===================================================== */

.access{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  text-align:center;
}

.access-name{
  opacity:0;

  animation:
    appear .7s ease forwards;

  animation-delay:.15s;
}

.access-status{
  margin-top:14px;

  font-size:7px;
  letter-spacing:.28em;

  color:rgba(255,255,255,.42);

  opacity:0;

  animation:
    appear .6s ease forwards;

  animation-delay:.65s;
}

@keyframes appear{

  from{
    opacity:0;
  }

  to{
    opacity:1;
  }

}


/* =====================================================
   MAIN FEED
===================================================== */

#viewport{

  width:100vw;
  height:100dvh;

  overflow-y:auto;
  overflow-x:hidden;

  background:#000;

  scroll-snap-type:y mandatory;

  -webkit-overflow-scrolling:touch;

  overscroll-behavior-y:none;

  scrollbar-width:none;
}

#viewport::-webkit-scrollbar{
  display:none;
}


/* =====================================================
   PAGES
===================================================== */

.page{

  position:relative;

  width:100vw;
  height:100dvh;
  min-height:100dvh;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#000;

  overflow:hidden;

  scroll-snap-align:start;

}


/* =====================================================
   MEDIA
===================================================== */

.page img,
.page video{

  display:block;

  width:100%;
  height:100%;

  object-fit:contain;

  background:#000;

  user-select:none;
  -webkit-user-select:none;

  -webkit-user-drag:none;

  pointer-events:none;
}


/* =====================================================
   INVISIBLE INSTAGRAM AREA
===================================================== */

.ig-cam{

  position:absolute;

  left:40%;
  top:38%;

  width:20%;
  height:24%;

  z-index:50;

  display:block;

  background:transparent;

  pointer-events:auto;
}


/* =====================================================
   INVISIBLE BOAT BEAR AREA
===================================================== */

.arrow-box{

  position:absolute;

  top:2%;
  right:2%;

  width:14%;
  height:8%;

  z-index:50;

  display:block;

  background:transparent;

  pointer-events:auto;
}


/* =====================================================
   NO BUBBLES
===================================================== */

/*
   There are intentionally no visible
   link bubbles or CTA labels.
*/

</style>

</head>

<body>


<!-- =====================================================
     PRIVATE ACCESS

</div>


<!-- =====================================================
     VISUAL FEED
===================================================== -->

<main id="viewport">


  <!-- 01 -->

  <!-- 03 -->

    <img
      src="restocking-fisshhfilet.jpg?v=25"

    class="page"

  <section class="page">

    ></video>

  </section>


</main>


<script>

/* =====================================================
   FISSHHFILET
   SIMPLE VIDEO ENGINE

   IMPORTANT:

   The browser controls scrolling.

   JavaScript does NOT control scrolling.

   This prevents skipping and fighting with Android.
===================================================== */


/* =====================================================
   ELEMENTS
===================================================== */

const viewport =
  document.getElementById("viewport");

const intro =
  document.getElementById("intro");

const pages =
  Array.from(
    document.querySelectorAll(".page")
  );

const videos =
  Array.from(
    document.querySelectorAll("video")
  );


/* =====================================================
   PRIVATE ACCESS INTRO
===================================================== */

const introSeen =
  sessionStorage.getItem(
    "fisshhfilet_intro_seen"
  );


if(introSeen){

  intro.remove();

}else{

  sessionStorage.setItem(
    "fisshhfilet_intro_seen",
    "1"
  );


  /*
    Very short.

    It gets out of the way quickly.
  */

  setTimeout(() => {

    intro.classList.add("hide");

    setTimeout(() => {

      if(
        intro &&
        intro.parentNode
      ){

        intro.remove();

      }

    },600);

  },1150);

}


/* =====================================================
   VIDEO STATE
===================================================== */

/*
   Keep track of the video currently playing.

   There is only ever ONE active video.
*/

let activeVideo = null;


/* =====================================================
   SEPHORA INITIAL POSITION
===================================================== */

/*
   This runs only once.

   It does NOT run every time Sephora
   becomes visible.
*/

const sephora =
  document.querySelector(
    'video[src*="Sephora"]'
  );


if(sephora){

  const initializeSephora =
    () => {

      if(
        !sephora.dataset.startSet
      ){

        sephora.dataset.startSet =
          "true";

        try{

          sephora.currentTime = .5;

        }catch(e){}

      }

    };


  if(sephora.readyState >= 1){

    initializeSephora();

  }else{

    sephora.addEventListener(
      "loadedmetadata",
      initializeSephora,
      {
        once:true
      }
    );

  }

}


/* =====================================================
   STOP ALL VIDEOS
===================================================== */

function stopAllVideos(except){

  videos.forEach(video => {

    if(video !== except){

      if(!video.paused){

        video.pause();

      }

    }

  });

}


/* =====================================================
   PLAY ONE VIDEO
===================================================== */

function playVideo(video){

  if(!video){
    return;
  }


  /*
    Stop everything else first.
  */

  stopAllVideos(video);


  /*
    If this is already the active video,
    don't touch its position.
  */

  if(activeVideo === video){

    if(video.paused){

      video.play().catch(
        () => {}
      );

    }

    return;

  }


  /*
    Change active video.
  */

  activeVideo = video;


  /*
    IMPORTANT:

    We DO NOT set currentTime here.

    Returning to a video resumes exactly
    where the browser left it.
  */

  video.play().catch(
    () => {}
  );

}


/* =====================================================
   FIND CURRENT PAGE
===================================================== */

function getCurrentPage(){

  const scrollTop =
    viewport.scrollTop;

  const height =
    viewport.clientHeight;

  /*
    Determine the nearest full-screen page.

    No scrollIntoView.
    No forced scrolling.
  */

  let index =
    Math.round(
      scrollTop / height
    );


  if(index < 0){
    index = 0;
  }

  if(index >= pages.length){
    index = pages.length - 1;
  }


  return pages[index];

}


/* =====================================================
   UPDATE VIDEO AFTER SCROLL
===================================================== */

let scrollTimer = null;


viewport.addEventListener(
  "scroll",
  () => {

    /*
      Do NOT manipulate scroll position.

      Wait until the user's finger movement
      has settled.
    */

    clearTimeout(scrollTimer);


    scrollTimer =
      setTimeout(() => {

        const page =
          getCurrentPage();


        if(!page){

          return;

        }


        const video =
          page.querySelector(
            "video"
          );


        if(video){

          playVideo(video);

        }else{

          /*
            Image page.

            Pause any video.
          */

          stopAllVideos(null);

          activeVideo = null;

        }

      },180);

  },
  {
    passive:true
  }
);


/* =====================================================
   INITIAL VIDEO
===================================================== */

setTimeout(() => {

  const firstPage =
    getCurrentPage();


  if(firstPage){

    const video =
      firstPage.querySelector(
        "video"
      );


    if(video){

      playVideo(video);

    }

  }

},300);


/* =====================================================
   VISIBILITY

   Android may suspend the tab.

   Pause videos when hidden.

   Resume the current page when returned.

   NEVER reset currentTime.
===================================================== */

document.addEventListener(
  "visibilitychange",
  () => {

    if(document.hidden){

      videos.forEach(video => {

        video.pause();

      });

      return;

    }


    /*
      Wait briefly for Android to
      restore the viewport.
    */

    setTimeout(() => {

      const page =
        getCurrentPage();


      if(!page){

        return;

      }


      const video =
        page.querySelector(
          "video"
        );


      if(video){

        playVideo(video);

      }

    },150);

  }
);


/* =====================================================
   EXTERNAL PAGE LINKS
===================================================== */

let tapStartX = 0;
let tapStartY = 0;
let tapStartTime = 0;


viewport.addEventListener(
  "touchstart",
  event => {

    const touch =
      event.touches[0];


    tapStartX =
      touch.clientX;

    tapStartY =
      touch.clientY;

    tapStartTime =
      Date.now();

  },
  {
    passive:true
  }
);


viewport.addEventListener(
  "touchend",
  event => {

    const touch =
      event.changedTouches[0];


    const movedX =
      Math.abs(
        touch.clientX -
        tapStartX
      );


    const movedY =
      Math.abs(
        touch.clientY -
        tapStartY
      );


    const duration =
      Date.now() -
      tapStartTime;


    /*
      This was a swipe.

      DO NOTHING.
    */

    if(
      movedX > 15 ||
      movedY > 15
    ){

      return;

    }


    /*
      Too long = not a tap.
    */

    if(duration > 400){

      return;

    }


    /*
      Actual anchor.
    */

    if(
      event.target.closest("a")
    ){

      return;

    }


    const page =
      event.target.closest(
        ".page"
      );


    if(!page){

      return;

    }


    const link =
      page.dataset.link;


    if(link){

      window.open(
        link,
        "_blank",
        "noopener,noreferrer"
      );

    }

  },
  {
    passive:true
  }
);


/* =====================================================
   IMAGE DRAGGING
===================================================== */

document
  .querySelectorAll("img")
  .forEach(img => {

    img.addEventListener(
      "dragstart",
      event => {

        event.preventDefault();

      }
    );

  });


/* =====================================================
   VIDEO CONTROLS
===================================================== */

videos.forEach(video => {

  video.controls = false;


  video.addEventListener(
    "contextmenu",
    event => {

      event.preventDefault();

    }
  );

});


/* =====================================================
   DO NOT ADD:

   IntersectionObserver
   scrollIntoView()
   pageshow scroll reset
   automatic currentTime resets
   custom swipe scrolling

   Native Android scrolling is in charge.
===================================================== */

</script>

</body>
  </html>
