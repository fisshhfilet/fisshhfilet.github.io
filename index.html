<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>fisshhfilet.github.io</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000}
body{overflow:hidden;font-family:monospace;background:#000}
#feed{width:100vw;height:100vh;overflow-y:auto;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;background:#000}
.page{width:100vw;height:100vh;scroll-snap-align:start;scroll-snap-stop:always;background:#000;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;overflow:hidden}
.page img,.page video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
.tap{position:absolute;inset:0;z-index:5}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.final{flex-direction:column;gap:38px;text-align:center}
.final div{opacity:0;animation:fadeIn .9s ease forwards}
.final div:nth-child(1){animation-delay:.3s}
.final div:nth-child(2){animation-delay:.9s}
.final div:nth-child(3){animation-delay:1.6s}
#shopFrame{width:100%;height:100%;border:0;background:#000}
</style>
</head>
<body>
<div id="feed">
<section class="page final" style="background:#000"><div style="color:#a8a8a8;font-size:10px;letter-spacing:.32em;animation:fadeIn .8s ease .2s both">@fisshhfilet</div></section>
<section class="page"><img src="betty.jpg"><a class="tap" href="https://instagram.com/fisshhfilet" target="_blank"></a></section>
<section class="page"><img src="waista.jpg"><a class="tap" href="https://instagram.com/fisshhfilet" target="_blank"></a></section>
<section class="page"><img src="bear-boat-hoodie.jpg"><a class="tap" href="https://naturalcatchtuna.com/" target="_blank"></a></section>
<section class="page"><video src="Sephora.mp4" muted loop playsinline preload="metadata" poster="betty.jpg"></video><a class="tap" href="https://instagram.com/fisshhfilet" target="_blank"></a></section>
<section class="page"><img src="qr-ware.jpg"><a class="tap" href="https://instagram.com/fisshhfilet" target="_blank"></a></section>
<section class="page"><video src="hakrs-flip.mp4" autoplay muted loop playsinline preload="auto" poster="hakrs-flip.jpg"></video><a class="tap" href="https://instagram.com/fisshhfilet" target="_blank"></a></section>
<section class="page" style="background:#000"><iframe id="shopFrame" src="shop.html" loading="lazy"></iframe></section>
<section class="page"><img src="restocking-soon-fix.jpg"><a class="tap" href="https://instagram.com/fisshhfilet" target="_blank"></a></section>
<section class="page"><img src="waista-question.jpg"><a class="tap" href="https://instagram.com/fisshhfilet" target="_blank"></a></section>
<section class="page"><img src="kalshi-trade.jpg"><a class="tap" href="https://kalshi.com" target="_blank"></a></section>
<section class="page"><img src="adults-only-beach.jpg"><a class="tap" href="https://instagram.com/fisshhfilet" target="_blank"></a></section>
<section class="page final" style="background:#000">
<div style="color:#a8a8a8;font-size:10px;letter-spacing:.32em">@fisshhfilet</div>
<div style="color:#fff;font-size:11px;letter-spacing:.36em">PRIVATE ACCESS</div>
<div style="color:#39e66f;font-size:10px;letter-spacing:.32em;font-weight:800">MEMBERS ONLY</div>
</section>
</div>
<script>
(function(){
var feed=document.getElementById('feed');
var io=new IntersectionObserver(function(es){
es.forEach(function(e){
var v=e.target.querySelector('video');
if(!v) return;
if(e.isIntersecting){try{v.play().catch(function(){})}catch(er){}}else{try{v.pause()}catch(er){}}
});
},{root:feed,threshold:0.6});
document.querySelectorAll('.page').forEach(function(p){io.observe(p);});
})();
</script>
</body>
</html>
