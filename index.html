<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FISSHHFILET</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
.top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:24px 20px;background:#000;z-index:100}
.logo{font-size:12px;letter-spacing:6px}
.back{border:1px solid #222;background:#000;color:#fff;padding:10px 18px;font-size:11px;letter-spacing:3px;cursor:pointer}
.page{display:none;min-height:100vh;background:#000}
.page.active{display:flex}
#home{flex-direction:column;padding:90px 0 70px;justify-content:flex-start}
.menu{width:100%;text-align:center;padding:20px 0 10px}
.menu button{display:block;width:100%;background:none;border:0;color:#fff;font-size:62px;font-weight:900;line-height:.85;letter-spacing:-1px;cursor:pointer}
.video-wrap{width:320px;max-width:90%;margin:20px auto 0;background:#000}
.video-wrap video{width:100%;aspect-ratio:9/16;object-fit:cover;display:block;background:#000}
.sub{flex-direction:column;justify-content:center;align-items:center;padding:100px 20px 80px;text-align:center}
.big{font-size:74px;font-weight:900;line-height:.9;text-align:center}
.small{margin-top:28px;font-size:10px;letter-spacing:3px;color:#666;text-align:center}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:center;padding:10px;z-index:101}
.save{background:#e60023;color:#fff;border:0;padding:10px 24px;border-radius:30px;font-weight:700;font-size:14px}
#admin{display:none;width:300px;margin:12px auto 0;background:#111;padding:10px;font-size:11px;color:#666;line-height:1.8;text-align:left}
</style>
</head>
<body>

<div class="top">
<div class="logo">FISSHHFILET</div>
<button id="backBtn" class="back" onclick="goHome()">← BACK</button>
</div>

<div id="home" class="page active">
<div class="menu">
<button onclick="go('galleries')">GALLERIES</button>
<button onclick="go('video')">VIDEO</button>
<button onclick="go('objects')">OBJECTS</button>
<button onclick="go('creators')">CREATORS</button>
<button onclick="go('archive')">ARCHIVE</button>
</div>
<div class="video-wrap">
<video id="v" autoplay muted loop playsinline controls>
<source src="./video.mp4?v=12" type="video/mp4">
</video>
<div id="admin"><div style="color:#f5c518">ADMIN ONLY</div>Views: <span id="c1">0</span><br>95%: <span id="c2">0</span><br>Pinterest: <span id="c3">0</span></div>
</div>
</div>

<div id="galleries" class="page sub"><div class="big">Restocking<br>Soon</div><div class="small">DM "WAITLIST" @CLUB52VOGUE.SHOP</div></div>
<div id="video" class="page sub"><div class="big">Visuals<br>Loading</div><div class="small">DM "WAITLIST" @CLUB52VOGUE.SHOP</div></div>
<div id="objects" class="page sub"><div class="big">Objects<br>Incoming</div><div class="small">DM "WAITLIST" @CLUB52VOGUE.SHOP</div></div>
<div id="creators" class="page sub"><div class="big">Creators<br>Soon</div><div class="small">DM "WAITLIST" @CLUB52VOGUE.SHOP</div></div>
<div id="archive" class="page sub"><div class="big">Archive<br>Loading</div><div class="small">DM "WAITLIST" @CLUB52VOGUE.SHOP</div></div>

<div class="bottom"><button class="save" onclick="navigator.clipboard.writeText(location.href)">Save</button></div>

<script>
const pages=['home','galleries','video','objects','creators','archive'];
function go(id){
 pages.forEach(p=>document.getElementById(p).classList.remove('active'));
 document.getElementById(id).classList.add('active');
 document.getElementById('backBtn').style.display='block';
 window.scrollTo(0,0);
}
function goHome(){
 pages.forEach(p=>document.getElementById(p).classList.remove('active'));
 document.getElementById('home').classList.add('active');
 document.getElementById('backBtn').style.display='none';
 window.scrollTo(0,0);
}
let s=JSON.parse(localStorage.getItem('ff12')||'{"v":0,"p95":0,"pin":0}');
if(document.referrer.includes('pinterest')){s.pin++}
localStorage.setItem('ff12',JSON.stringify(s));
const vid=document.getElementById('v');
vid.addEventListener('play',()=>{if(vid.currentTime<1){s.v++;localStorage.setItem('ff12',JSON.stringify(s))}});
vid.addEventListener('timeupdate',()=>{if(vid.duration&&vid.currentTime/vid.duration>0.95&&!vid._f){vid._f=1;s.p95++;localStorage.setItem('ff12',JSON.stringify(s))}});
if(location.search.includes('admin')){document.getElementById('admin').style.display='block'}
setInterval(()=>{document.getElementById('c1').textContent=s.v;document.getElementById('c2').textContent=s.p95;document.getElementById('c3').textContent=s.pin},500);
</script>
</body>
</html>
