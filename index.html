<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FISSHHFILET</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
.top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:26px 18px;background:#000;z-index:100}
.logo{font-size:11px;letter-spacing:7px;cursor:pointer}
.back{border:1px solid #222;background:#000;color:#fff;padding:10px 16px;font-size:10px;letter-spacing:4px;cursor:pointer;display:none}
.page{display:none;min-height:100vh;background:#000}
.page.active{display:flex}
#home{flex-direction:column;padding:100px 0 40px}
.menu{width:100%;text-align:center}
.menu button{display:block;width:100%;background:none;border:0;color:#fff;font-size:68px;font-weight:900;line-height:.88;letter-spacing:-1.5px;cursor:pointer}
.video-wrap{width:340px;max-width:92%;margin:26px auto 0}
.video-wrap video{width:100%;aspect-ratio:9/16;object-fit:cover;display:block;background:#000}
.sub{flex-direction:column;justify-content:center;align-items:center;padding:120px 20px 80px;text-align:center}
.big{font-size:78px;font-weight:900;line-height:.9}
.small{margin-top:32px;font-size:10px;letter-spacing:3px;color:#555}
/* CODED LOOK */
.coded{flex-direction:column;padding:0;background:#000}
.coded-head{padding:26px 18px 10px;background:#000}
.coded-head .small-logo{font-size:11px;letter-spacing:7px}
.coded-head .big-title{font-size:72px;font-weight:900;margin-top:18px;letter-spacing:-1px;line-height:.9}
.coded video{width:100%;height:auto;display:block;background:#000}
#admin{display:none;width:320px;margin:12px auto 0;background:#111;padding:12px;font-size:11px;color:#666;line-height:2;border:1px solid #222}
#admin b{color:#f5c518}
</style>
</head>
<body>
<div class="top">
<div class="logo" onclick="checkCode()">FISSHHFILET</div>
<button id="backBtn" class="back" onclick="goHome()">← BACK</button>
</div>

<div id="home" class="page active">
<div class="menu">
<button onclick="go('galleries')">GALLERIES</button>
<button onclick="go('videoPage')">VIDEO</button>
<button onclick="go('objects')">OBJECTS</button>
<button onclick="go('creators')">CREATORS</button>
<button onclick="go('archive')">ARCHIVE</button>
</div>
<div class="video-wrap">
<video id="v1" autoplay muted loop playsinline>
<source src="./video.mp4?v=20" type="video/mp4">
</video>
<div id="admin"><b>ADMIN</b> - code shipped<br>MAIN: <span id="c1">0</span> | 95% <span id="c2">0</span><br>VIDEO2: <span id="c3">0</span> | 95% <span id="c4">0</span><br>PIN: <span id="c5">0</span></div>
</div>
</div>

<div id="galleries" class="page sub"><div class="big">Restocking<br>Soon</div><div class="small">DM "WAITLIST" @CLUB52VOGUE.SHOP</div></div>

<!-- VIDEO PAGE - CODED LOOK LIKE YOUR SCREENSHOT -->
<div id="videoPage" class="page coded">
<div class="coded-head">
<div class="small-logo">FISSHHFILET</div>
<div class="big-title">VIDEO</div>
</div>
<video id="v2" loop playsinline controls>
<source src="./video2.mp4?v=2" type="video/mp4">
</video>
</div>

<div id="objects" class="page sub"><div class="big">Objects<br>Incoming</div><div class="small">DM "WAITLIST" @CLUB52VOGUE.SHOP</div></div>
<div id="creators" class="page sub"><div class="big">Creators<br>Soon</div><div class="small">DM "WAITLIST" @CLUB52VOGUE.SHOP</div></div>

<!-- ARCHIVE PAGE - CODED LOOK EXACT LIKE YOUR 3 IMAGES -->
<div id="archive" class="page coded">
<div class="coded-head">
<div class="small-logo">FISSHHFILET</div>
<div class="big-title">ARCHIVE</div>
</div>
<video id="v3" loop playsinline muted>
<source src="./video.mp4?v=20" type="video/mp4">
</video>
</div>

<script>
const pages=['home','galleries','videoPage','objects','creators','archive'];
const v1=document.getElementById('v1');
const v2=document.getElementById('v2');
const v3=document.getElementById('v3');
function go(id){
 pages.forEach(p=>document.getElementById(p).classList.remove('active'));
 document.getElementById(id).classList.add('active');
 document.getElementById('backBtn').style.display='block';
 // pause all
 v1.pause(); v2.pause(); v3.pause();
 if(id==='videoPage') v2.play();
 if(id==='archive') v3.play();
 window.scrollTo(0,0);
}
function goHome(){
 pages.forEach(p=>document.getElementById(p).classList.remove('active'));
 document.getElementById('home').classList.add('active');
 document.getElementById('backBtn').style.display='none';
 v2.pause(); v3.pause();
 v1.play();
 window.scrollTo(0,0);
}
function checkCode(){
 let c=prompt('code');
 if(c==='shipped') document.getElementById('admin').style.display='block';
}
let s=JSON.parse(localStorage.getItem('ff_ship')||'{"v1":0,"v1_95":0,"v2":0,"v2_95":0,"pin":0}');
if(document.referrer.includes('pinterest')) s.pin++;
if(location.search.includes('shipped')) document.getElementById('admin').style.display='block';
v1.addEventListener('play',()=>{if(v1.currentTime<1){s.v1++;localStorage.setItem('ff_ship',JSON.stringify(s))}});
v1.addEventListener('timeupdate',()=>{if(v1.duration&&v1.currentTime/v1.duration>0.95&&!v1._f){v1._f=1;s.v1_95++;localStorage.setItem('ff_ship',JSON.stringify(s))}});
v2.addEventListener('play',()=>{if(v2.currentTime<1){s.v2++;localStorage.setItem('ff_ship',JSON.stringify(s))}});
v2.addEventListener('timeupdate',()=>{if(v2.duration&&v2.currentTime/v2.duration>0.95&&!v2._f){v2._f=1;s.v2_95++;localStorage.setItem('ff_ship',JSON.stringify(s))}});
setInterval(()=>{document.getElementById('c1').textContent=s.v1;document.getElementById('c2').textContent=s.v1_95;document.getElementById('c3').textContent=s.v2;document.getElementById('c4').textContent=s.v2_95;document.getElementById('c5').textContent=s.pin;},600);
</script>
</body>
</html>
