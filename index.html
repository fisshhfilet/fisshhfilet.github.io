<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FISSHHFILET</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000;color:#fff;font-family:Inter,Helvetica,Arial,sans-serif;height:100%;width:100%;overflow:hidden}
#app{min-height:100vh;width:100%;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:28px 24px}
.logo{font-size:11px;letter-spacing:0.5em;font-weight:400}
.back{border:1px solid #222;padding:10px 18px;font-size:11px;letter-spacing:0.3em;background:transparent;color:#fff}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px}
.stack{font-weight:900;font-size:42px;line-height:0.95;letter-spacing:-0.02em;text-transform:uppercase}
.stack div{cursor:pointer;padding:4px 0}
.big{font-weight:900;font-size:64px;line-height:0.9;letter-spacing:-0.03em;text-align:center}
.small{margin-top:36px;font-size:11px;letter-spacing:0.32em;color:#7a7a7a}
@media(min-width:768px){.stack{font-size:56px}.big{font-size:96px}}
</style>
</head>
<body>
<div id="app">
<header>
<div class="logo">FISSHHFILET</div>
<button id="backBtn" class="back" style="display:none">← BACK</button>
</header>
<div id="content" class="center"></div>
</div>
<script>
const home = `<div class="stack"><div data-v="galleries">GALLERIES</div><div data-v="video">VIDEO</div><div data-v="objects">OBJECTS</div><div data-v="creators">CREATORS</div><div data-v="archive">ARCHIVE</div></div>`;
const pages = {
galleries: {t1:'Restocking',t2:'Soon'},
video: {t1:'Visuals',t2:'Loading'},
objects: {t1:'Objects',t2:'Incoming'},
creators: {t1:'Creators',t2:'Soon'},
archive: {t1:'Archive',t2:'Loading'}
};
const content = document.getElementById('content');
const backBtn = document.getElementById('backBtn');
function showHome(){
 backBtn.style.display='none';
 content.innerHTML = home;
 document.querySelectorAll('[data-v]').forEach(el=>{
   el.onclick = ()=> showPage(el.dataset.v);
 });
}
function showPage(k){
 const p = pages[k];
 backBtn.style.display='block';
 content.innerHTML = `<div class="big">${p.t1}<br>${p.t2}</div><div class="small">DM "WAITLIST" @CLUB52VOGUE.SHOP</div>`;
}
backBtn.onclick = showHome;
showHome();
</script>
</body>
</html>
