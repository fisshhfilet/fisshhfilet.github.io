<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FISSHHFILET</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif;height:100%;overflow:hidden}
.top{position:fixed;top:0;left:0;right:0;height:48px;display:flex;align-items:center;padding:0 14px;background:#000;z-index:100}
.logo{font-size:10px;letter-spacing:6px}
.back{position:fixed;top:10px;right:12px;border:1px solid #333;background:#000;color:#fff;padding:6px 12px;font-size:9px;letter-spacing:3px;display:none;z-index:101}
.page{display:none;height:100vh;height:100dvh;background:#000;overflow-y:auto}
.page.active{display:flex}
#home{flex-direction:column;padding:50px 0 0;align-items:center}
#home .menu{width:100%;text-align:center;flex-shrink:0}
#home .menu button{display:block;width:100%;background:none;border:0;color:#fff;font-size:28px;font-weight:900;line-height:1.12;cursor:pointer}
#home .video-wrap{width:92%;margin-top:12px;flex-shrink:0}
#home .video-wrap video{width:100%;height:62vh;object-fit:cover;display:block;background:#111}
.sub{flex-direction:column;justify-content:center;align-items:center;padding:60px 20px;text-align:center;width:100%}
.big{font-size:44px;font-weight:900;line-height:.9}
.small{margin-top:14px;font-size:9px;letter-spacing:3px;color:#555}
.coded{flex-direction:column;align-items:center;padding:56px 0 10px;width:100%}
.coded-title{font-size:38px;font-weight:900;padding:6px 0 8px}
.coded .video-wrap{width:86%;margin-top:6px}
.coded .video-wrap video{width:100%;aspect-ratio:9/13;object-fit:cover;display:block;background:#111}
#admin{display:none;width:90%;margin:6px auto 0;background:#111;padding:8px;font-size:9px;color:#666;border:1px solid #222}
</style>
</head>
<body>
<div class="top"><div class="logo" onclick="checkCode()">FISSHHFILET</div></div>
<button id="backBtn" class="back" onclick="goHome()">← BACK</button>

<div id="home" class="page active">
<div class="menu">
<button onclick="go('galleries')">GALLERIES</button>
<button onclick="go('videoPage')">VIDEO</button>
<button onclick="go('objects')">OBJECTS</button>
<button onclick="go('creators')">CREATORS</button>
<button onclick="go('archive')">ARCHIVE</button>
</div>
<div class="video-wrap">
<video id="v1" playsinline controls preload="metadata">
<source src="./video.mp4" type="video/mp4">
</video>
<div id="admin"><b>shipped</b> <span id="c1">0</span>/<span id="c2">0</span> <span id="c3">0</span>/<span id="c4">0</span> <span id="c5">0</span></div>
</div>
</div>

<div id="galleries" class="page sub"><div class="big">Restocking<br>Soon</div><div class="small">DM "WAITLIST" @CLUB52VOGUE.SHOP</div></div>
<div id="videoPage" class="page coded">
<div class="coded-title">VIDEO</div>
<div class="video-wrap"><video id="v2" playsinline controls preload="metadata"><source src="./video2.mp4" type="video/mp4"></video></div>
</div>
<div id="objects" class="page sub"><div class="big">Objects<br>Incoming</div><div class="small">DM "WAITLIST" @CLUB52VOGUE.SHOP</div></div>
<div id="creators" class="page sub"><div class="big">Creators<br>Soon</div><div class="small">DM "WAITLIST" @CLUB52VOGUE.SHOP</div></div>
<div id="archive" class="page sub"><div class="big">Archive<br>Soon</div><div class="small">DM "WAITLIST" @CLUB52VOGUE.SHOP</div></div>

<script>
const pages=['home','galleries','videoPage','objects','creators','archive'];
const v1=document.getElementById('v1'),v2=document.getElementById('v2');
function stopAll(){try{v1.pause()}catch(e){};try{v2.pause()}catch(e){};}
function go(id){stopAll();pages.forEach(p=>document.getElementById(p).classList.remove('active'));document.getElementById(id).classList.add('active');document.getElementById('backBtn').style.display='block';}
function goHome(){stopAll();pages.forEach(p=>document.getElementById(p).classList.remove('active'));document.getElementById('home').classList.add('active');document.getElementById('backBtn').style.display='none';}
function checkCode(){let c=prompt('code'); if(c==='shipped') document.getElementById('admin').style.display='block';}
let s=JSON.parse(localStorage.getItem('ff_ship')||'{"v1":0,"v1_95":0,"v2":0,"v2_95":0,"pin":0}');
if(document.referrer.includes('pinterest')) s.pin++;
if(location.search.includes('shipped')) document.getElementById('admin').style.display='block';
v1.addEventListener('play',()=>{if(v1.currentTime<1){s.v1++;localStorage.setItem('ff_ship',JSON.stringify(s))}});
v1.addEventListener('ended',()=>{s.v1_95++;localStorage.setItem('ff_ship',JSON.stringify(s))});
v2.addEventListener('play',()=>{if(v2.currentTime<1){s.v2++;localStorage.setItem('ff_ship',JSON.stringify(s))}});
v2.addEventListener('ended',()=>{s.v2_95++;localStorage.setItem('ff_ship',JSON.stringify(s))});
setInterval(()=>{document.getElementById('c1').textContent=s.v1;document.getElementById('c2').textContent=s.v1_95;document.getElementById('c3').textContent=s.v2;document.getElementById('c4').textContent=s.v2_95;document.getElementById('c5').textContent=s.pin;},600);
</script>
</body>
</html>
