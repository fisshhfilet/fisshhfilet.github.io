<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FISSHHFILET</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;background:#000;overflow:hidden}
#intro{position:fixed;inset:0;z-index:30;background:#000;display:flex;align-items:center;justify-content:center;color:#fff;font-family:Menlo,monospace;letter-spacing:.35em;font-size:11px}
#viewport{height:100dvh;width:100vw;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scroll-behavior:smooth;background:#000}
.page{height:100dvh;width:100vw;scroll-snap-align:start;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;background:#000;position:relative;flex-shrink:0}
.page img,.page video{max-width:100vw;max-height:100dvh;width:100%;height:100%;object-fit:contain;background:#000;display:block}
.ig-cam{position:absolute;left:40%;top:38%;width:20%;height:24%;z-index:5}
</style>
</head>
<body>
<div id="intro">@fisshhfilet</div>
<div id="viewport">

<section class="page"><img src="betty.jpg?v=17"></section>
<section class="page"><img src="waista.jpg?v=17"></section>

<!-- Restocking - only Instagram cam is clickable, goes to IG not dead.shop -->
<section class="page" id="restock">
<img src="restocking-fisshhfilet.jpg?v=17">
<a class="ig-cam" href="https://www.instagram.com/club52vogue.shop/" target="_blank"></a>
</section>

<section class="page"><video src="Sephora.mp4?v=17" playsinline muted loop preload="auto"></video></section>
<section class="page"><img src="adults-only.jpg?v=17" data-link="https://www.instagram.com/club52vogue.shop/"></section>
<section class="page"><video src="RHUDE.mp4?v=17" playsinline muted preload="auto"></video></section>
<section class="page"><img src="mc.jpg?v=17" data-link="https://www.instagram.com/club52vogue.shop/"></section>
<section class="page" data-link="https://www.liquid-iv.com"><img src="liquid.jpg?v=17"></section>
<section class="page" data-link="https://kalshi.com"><img src="kalshi.jpg?v=17"></section>
<section class="page" data-link="https://www.instagram.com/club52vogue.shop/"><img src="boatbear.jpg?v=17"></section>
<section class="page"><video src="GOMF.mp4?v=17" playsinline muted preload="auto"></video></section>

</div>
<script>
// smooth native scroll - no more horrible translate
const viewport = document.getElementById('viewport');
const pages = [...document.querySelectorAll('.page')];
const intro = document.getElementById('intro');
setTimeout(()=>{ intro.style.transition='opacity.6s'; intro.style.opacity='0'; setTimeout(()=>intro.remove(),600); }, 900);

// play video when in view
const io = new IntersectionObserver(entries=>{
 entries.forEach(e=>{
  const v=e.target.querySelector('video');
  if(!v) return;
  if(e.isIntersecting){ v.currentTime=e.target.querySelector('video').src.includes('Sephora')?0.25:0; v.play().catch(()=>{}); }
  else v.pause();
 });
},{threshold:0.6});
pages.forEach(p=>io.observe(p));

// tap to open link - clean click, not a square block
let sy=0, t0=0;
viewport.addEventListener('touchstart', e=>{ sy=e.touches[0].clientY; t0=Date.now(); }, {passive:true});
viewport.addEventListener('touchend', e=>{
 const dy=Math.abs(e.changedTouches[0].clientY - sy);
 if(dy>30) return; // swipe, don't open link
 if(Date.now()-t0>400) return;
 const page = e.target.closest('.page');
 const link = page?.dataset?.link;
 if(link &&!e.target.closest('a')) window.open(link,'_blank');
},{passive:true});
</script>
</body>
</html>
