<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FISSHHFILET</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;background:#000;overflow:hidden}
#intro{position:fixed;inset:0;z-index:30;background:#000;display:flex;align-items:center;justify-content:center;color:#fff;font-family:Menlo,monospace;letter-spacing:.35em;font-size:11px}
#viewport{height:100dvh;width:100vw;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;background:#000}
.page{height:100dvh;width:100vw;scroll-snap-align:start;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;background:#000;position:relative}
.page img,.page video{max-width:100vw;max-height:100dvh;width:100%;height:100%;object-fit:contain;background:#000;display:block}
.ig-cam{position:absolute;left:40%;top:38%;width:20%;height:24%;z-index:5}
</style>
</head>
<body>
<div id="intro">@fisshhfilet</div>
<div id="viewport">
<section class="page"><img src="betty.jpg?v=18"></section>
<section class="page"><img src="waista.jpg?v=18"></section>
<section class="page"><a class="ig-cam" href="https://www.instagram.com/club52vogue.shop/" target="_blank"></a><img src="restocking-fisshhfilet.jpg?v=18"></section>
<section class="page"><video id="sephora" src="Sephora.mp4?v=18" playsinline preload="auto" muted loop></video></section>
<section class="page"><img src="adults-only.jpg?v=18"></section>
<section class="page"><video src="RHUDE.mp4?v=18" playsinline preload="auto"></video></section>
<section class="page"><img src="mc.jpg?v=18"></section>
<section class="page"><video src="liquid.mp4?v=18" playsinline preload="auto" loop></video></section>
<section class="page"><img src="kalshi.jpg?v=18"></section>
<section class="page"><img src="boatbear.jpg?v=18"></section>
<section class="page"><video src="GOMF.mp4?v=18" playsinline preload="auto"></video></section>
</div>
<script>
const viewport=document.getElementById('viewport');
const intro=document.getElementById('intro');
const pages=[...document.querySelectorAll('.page')];
setTimeout(()=>{intro.style.transition='opacity.6s';intro.style.opacity='0';setTimeout(()=>intro.remove(),600);},900);

// smooth native scroll - no horrible jump
let firstInteraction=true;
viewport.addEventListener('touchstart',()=>{
 if(firstInteraction){
  document.querySelectorAll('video').forEach(v=>{ v.muted=false; v.volume=1; });
  firstInteraction=false;
 }
},{passive:true, once:true});

const io=new IntersectionObserver(entries=>{
 entries.forEach(e=>{
  const v=e.target.querySelector('video');
  if(!v) return;
  if(e.isIntersecting){
   // SEPHORA FIX: skip the glitchy first 0.5s
   if(v.id==='sephora'){ v.currentTime=0.5; }
   else v.currentTime=0;
   v.muted=false;
   v.play().catch(()=>{ v.muted=true; v.play(); });
  } else v.pause();
 });
},{threshold:0.7});
pages.forEach(p=>io.observe(p));
</script>
</body>
</html>
