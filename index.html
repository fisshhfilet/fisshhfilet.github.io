<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FISSHHFILET</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;background:#000;overflow:hidden}
body{position:fixed;inset:0;background:#000}
#intro{position:fixed;inset:0;z-index:20;background:#000;display:flex;align-items:center;justify-content:center;color:#fff;font-family:Menlo,monospace;letter-spacing:.35em;font-size:11px;transition:opacity.8s ease}
#viewport{height:100dvh;width:100vw;overflow:hidden;background:#000}
#track{height:100dvh;width:100vw;will-change:transform;transition:transform 620ms cubic-bezier(.32,.72,0,1)}
.page{height:100dvh;width:100vw;display:flex;align-items:center;justify-content:center;background:#000;position:relative;overflow:hidden}
.page img,.page video{max-width:100vw;max-height:100dvh;width:100%;height:100%;object-fit:contain;display:block;background:#000}
.page video{opacity:0;transform:scale(.97);transition:opacity.6s ease, transform.7s cubic-bezier(.32,.72,0,1)}
.page.active video{opacity:1;transform:scale(1)}
</style>
</head>
<body>
<div id="intro">@fisshhfilet</div>
<div id="viewport"><div id="track">
<section class="page"><img src="betty.jpg"></section>
<section class="page"><img src="waista.jpg"></section>
<section class="page"><img src="restocking-fisshhfilet.jpg"></section>
<section class="page video-page"><video src="Sephora.mp4" playsinline preload="auto" loop></video></section>
<section class="page"><img src="adults-only.jpg"></section>
<section class="page video-page"><video src="RHUDE.mp4" playsinline preload="auto"></video></section>
<section class="page"><img src="mc.jpg"></section>
<section class="page video-page"><video src="liquid.mp4" playsinline preload="auto" loop></video></section>
<section class="page video-page"><video src="GOMF.mp4" playsinline preload="auto"></video></section>
</div></div>
<script>
let i=0; const track=document.getElementById('track'); const pages=[...document.querySelectorAll('.page')]; const intro=document.getElementById('intro'); const total=pages.length;
function render(){
 track.style.transform=`translate3d(0,${-i*100}dvh,0)`;
 pages.forEach((p,k)=>{
  p.classList.toggle('active',k===i);
  const v=p.querySelector('video');
  if(!v) return;
  if(k===i){
   v.currentTime = (k===3?0.2:0); // Sephora skip jump frame
   v.muted=false; v.volume=1;
   setTimeout(()=>v.play().catch(()=>{ v.muted=true; v.play(); }),80);
  } else { v.pause(); }
 });
}
function next(){ if(i<total-1){ i++; render(); } }
function prev(){ if(i>0){ i--; render(); } }
// intro fade only — medium
setTimeout(()=>{ intro.style.opacity='0'; setTimeout(()=>intro.remove(),800); },1200);
// SWIPE ONLY — no tap advance on videos
let sy=0;
addEventListener('touchstart', e=>{ sy=e.touches[0].clientY; }, {passive:true});
addEventListener('touchend', e=>{
 const dy=e.changedTouches[0].clientY-sy;
 if(Math.abs(dy)>45){ dy<0?next():prev(); }
}, {passive:true});
// desktop wheel
addEventListener('wheel', e=>{ if(Math.abs(e.deltaY)>30){ e.deltaY>0?next():prev(); } }, {passive:true});
render();
</script>
</body>
</html>
