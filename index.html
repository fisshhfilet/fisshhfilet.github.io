<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WAISTA?</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial;overflow:hidden}
.page{display:none;height:100vh;height:100dvh}
.page.active{display:flex}
#waista{flex-direction:column;background:#000 url(./waista.jpg) center/cover no-repeat}
#waista .qr{flex:1}
#waista .bottom{height:70px;background:#3d2a1e;display:flex;align-items:center;justify-content:center}
#home{flex-direction:column;align-items:center;padding-top:40px;background:#000;overflow-y:auto}
.v{width:92%;margin-top:10px}
.v video{width:100%;height:65vh;object-fit:cover;background:#111}
.menu{width:100%;text-align:center;margin-top:12px}
.menu button{display:block;width:100%;background:0;border:0;color:#fff;font-size:26px;font-weight:900;line-height:1.25}
</style>
</head>
<body>

<div id="waista" class="page active" onclick="go('home')">
<div class="qr"></div>
<div class="bottom"><div style="width:36px;height:4px;background:#fff;border-radius:10px"></div></div>
</div>

<div id="home" class="page">
<div style="font-size:10px;letter-spacing:6px">FISSHHFILET</div>
<div class="v"><video controls playsinline autoplay muted loop src="./video.mp4"></video></div>
<div class="menu">
<button onclick="go('galleries')">GALLERIES</button>
<button onclick="go('v2')">VIDEO</button>
<button onclick="go('objects')">OBJECTS</button>
<button onclick="go('creators')">CREATORS</button>
<button onclick="go('archive')">ARCHIVE</button>
</div>
</div>

<div id="galleries" class="page" style="justify-content:center;align-items:center">Restocking Soon</div>
<div id="v2" class="page" style="justify-content:center;align-items:center"><video controls src="./video2.mp4" style="width:86%"></video></div>
<div id="objects" class="page" style="justify-content:center;align-items:center">Objects Incoming</div>
<div id="creators" class="page" style="justify-content:center;align-items:center">Creators Soon</div>
<div id="archive" class="page" style="justify-content:center;align-items:center">Archive Soon</div>

<script>
function go(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active')}
</script>
</body>
</html>
