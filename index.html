<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>FISSHHFILET</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;background:#000;overflow:hidden}
body{position:fixed;inset:0;background:#000}
#intro{position:fixed;inset:0;z-index:20;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-family:Menlo,monospace;font-size:12px;letter-spacing:.3em;gap:12px}
#viewport{height:100dvh;width:100vw;overflow:hidden;background:#000}
#track{height:100dvh;width:100vw;will-change:transform;transition:transform 500ms cubic-bezier(.32,.72,0,1)}
.page{height:100dvh;width:100vw;display:flex;align-items:center;justify-content:center;background:#000;position:relative}
.page img,.page video{max-width:100vw;max-height:100dvh;width:100%;height:100%;object-fit:contain;display:block;background:#000}
</style>
</head>
<body>
<div id="intro"><span>@fisshhfilet</span><span style="font-size:10px;opacity:.7">[ TAP FOR SOUND ]</span></div>
<div id="viewport">
<div id="track">
<!-- 1 BETTY - now JPG not WEBP -->
<section class="page"><img src="betty.jpg" onerror="this.src='top_10_sources_betty_boop.webp'" alt="betty"></section>
<!-- 2 WAISTA -->
<section class="page"><img src="waista.jpg" alt="waista"></section>
<!-- 3 RESTOCKING - now correct name -->
<section class="page"><img src="restocking-fisshhfilet.jpg" alt="restocking"></section>
<!-- 4 SEPHORA with sound -->
<section class="page"><video id="v-sephora" src="Sephora.mp4" playsinline preload="auto" loop></video></section>
<!-- 5 ADULTS ONLY -->
<section class="page"><img src="adults-only.jpg" alt="adults"></section>
<!-- 6 RHUDE with sound -->
<section class="page"><video id="v-rhude" src="RHUDE.mp4" playsinline preload="auto"></video></section>
<!-- 7 GOMF with sound - fixed double.mp4 -->
<section class="page"><video id="v-gomf" src="GOMF.mp4" playsinline preload="auto"></video></section>
</div>
</div>
<script>
let i=0; const pages=document.querySelectorAll('.page'); const track=document.getElementById('track'); const intro=document.getElementById('intro'); const total=pages.length;
let soundOn=false;
function unlockSound(){
  if(soundOn) return;
  soundOn=true;
  document.querySelectorAll('video').forEach(v=>{ v.muted=false; v.volume=1; v.play().catch(()=>{}); });
  intro.style.opacity='0'; setTimeout(()=>intro.remove(),600);
}
function render(){
  track.style.transform='translate3d(0,'+(-i*100)+'dvh,0)';
  pages.forEach((p,k)=>{
    const v=p.querySelector('video');
    if(!v) return;
    if(k===i){
      v.currentTime=0;
      if(soundOn){ v.muted=false; v.volume=1; }
      v.play().catch(()=>{ v.muted=true; v.play().catch(()=>{}); });
    } else { v.pause(); }
  });
}
function next(){ if(i<total-1){i++; render();} }
function prev(){ if(i>0){i--; render();} }
intro.addEventListener('click', unlockSound);
document.addEventListener('touchstart', e=>{ window._sy=e.touches[0].clientY; window._t0=Date.now(); }, {passive:true});
document.addEventListener('touchend', e=>{
  unlockSound();
  const dy=e.changedTouches[0].clientY-window._sy;
  if(Math.abs(dy)>50){ dy<0?next():prev(); } else if(Date.now()-window._t0<300){ next(); }
}, {passive:true});
document.addEventListener('click', ()=>{ unlockSound(); });
pages.forEach(p=>{
  const v=p.querySelector('video');
  if(v) v.addEventListener('ended', ()=>{ if(i<total-1) next(); });
});
render();
</script>
</body>
</html>
