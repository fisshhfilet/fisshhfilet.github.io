<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WAISTA?</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial;height:100vh;overflow:hidden}
.page{display:none;height:100vh}
.page.active{display:flex}
#waista{flex-direction:column;background:url(./waista.jpg) center/cover}
#waista .qr{flex:1;position:relative}
#waista .tag{position:absolute;right:15%;top:58%;width:80px;height:50px;background:#fff;color:#000;font-size:10px;text-align:center;padding:5px;cursor:pointer}
#waista .bottom{height:80px;background:#3d2a1e;display:flex;flex-direction:column;align-items:center;justify-content:center}
#home{flex-direction:column;padding-top:50px;align-items:center;background:#000}
.menu button{display:block;width:100%;background:0;border:0;color:#fff;font-size:28px;font-weight:900;line-height:1.2}
.video{width:92%;margin-top:10px}
.video video{width:100%;height:62vh;object-fit:cover}
</style>
</head>
<body>

<!-- PAGE 1 = WAISTA JOKE -->
<div id="waista" class="page active" onclick="go('home')">
<div class="qr"><div class="tag">Wai$StA<br>QR</div></div>
<div class="bottom"><div>Why Am I Seeing This Ad?</div><div style="margin-top:8px;font-size:12px;opacity:.7">Swipe up to explore area</div></div>
</div>

<!-- PAGE 2 = BOOTY REVEAL -->
<div id="home" class="page">
<div style="font-size:32px;font-weight:900;text-align:center">WAISTA?<br><span style="font-size:11px;letter-spacing:3px;color:#666">WHY AM I SEEING THIS ASS?</span></div>
<div class="video"><video controls playsinline autoplay muted loop src="./video.mp4"></video></div>
<div class="menu">
<button onclick="go('galleries')">GALLERIES</button>
<button onclick="go('video2')">VIDEO</button>
<button onclick="go('archive')">ARCHIVE</button>
</div>
</div>

<div id="galleries" class="page" style="justify-content:center;align-items:center;text-align:center">Restocking Soon</div>
<div id="video2" class="page" style="justify-content:center;align-items:center"><video controls src="./video2.mp4" style="width:86%"></video></div>
<div id="archive" class="page" style="justify-content:center;align-items:center;text-align:center">Archive Soon</div>

<script>
function go(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active')}
</script>
</body>
</html>
