<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FISSHHFILET</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial Black,Arial,sans-serif}
.top{padding:24px 22px;font-size:12px;letter-spacing:8px;font-family:Arial,sans-serif}
.menu{text-align:center;padding:40px 0 20px}
.menu a{display:block;color:#fff;font-size:56px;line-height:0.9;font-weight:900;text-decoration:none;letter-spacing:-1px}
.menu a:hover{color:#f5c518}
.video-wrap{max-width:340px;margin:20px auto 0;padding:0 14px}
.video-box{width:100%;aspect-ratio:9/16;background:#111;border:1px solid #222;overflow:hidden}
video{width:100%;height:100%;object-fit:cover;display:block}
.restock{display:none;max-width:340px;margin:20px auto;border:1px solid #222;padding:18px;text-align:center;font-family:Arial,sans-serif}
.restock h2{font-size:13px;letter-spacing:2px}
.restock p{font-size:12px;color:#888;margin-top:8px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:center;padding:12px}
.save{background:#e60023;color:#fff;border:0;padding:12px 28px;border-radius:30px;font-weight:700}
#admin{display:none;max-width:340px;margin:20px auto;background:#111;padding:12px;border-radius:10px;font-family:Arial,sans-serif;font-size:11px;line-height:2;color:#666}
#admin b{color:#fff}
</style>
</head>
<body>
<div class="top">FISSHHFILET</div>

<div class="menu">
<a href="#" onclick="show('galleries');return false">GALLERIES</a>
<a href="#" onclick="document.getElementById('vid').scrollIntoView({behavior:'smooth'});return false">VIDEO</a>
<a href="#" onclick="show('objects');return false">OBJECTS</a>
<a href="#" onclick="show('creators');return false">CREATORS</a>
<a href="#" onclick="show('archive');return false">ARCHIVE</a>
</div>

<div id="vid" class="video-wrap">
<div class="video-box">
<video autoplay muted loop playsinline controls>
<source src="./video.mp4?v=9" type="video/mp4">
</video>
</div>

<div id="objects" class="restock"><h2>OBJECTS - RESTOCKING SOON</h2><p>Drop 09.15 - Follow @fisshhfilet for first access</p></div>
<div id="creators" class="restock"><h2>CREATORS</h2><p>Coming soon</p></div>
<div id="archive" class="restock"><h2>ARCHIVE</h2><p>Coming soon</p></div>
<div id="galleries" class="restock"><h2>GALLERIES</h2><p>Coming soon</p></div>

<div id="admin">
<div style="color:#f5c518;font-weight:700">PRIVATE - ONLY YOU</div>
<b>Impressions:</b> <span id="a1">0</span><br>
<b>Video views:</b> <span id="a2">0</span><br>
<b>95%:</b> <span id="a3">0</span><br>
<b>From Pinterest:</b> <span id="a4">0</span>
</div>

</div>
<div class="bottom"><button class="save" onclick="navigator.clipboard.writeText(location.href);alert('Link copied')">Save</button></div>

<script>
function show(id){
 document.querySelectorAll('.restock').forEach(e=>e.style.display='none');
 document.getElementById(id).style.display='block';
 document.getElementById(id).scrollIntoView({behavior:'smooth'});
}
let s=JSON.parse(localStorage.getItem('ff_final')||'{"imp":0,"v":0,"p95":0,"pin":0}');
s.imp++; if(document.referrer.includes('pinterest')) s.pin++;
localStorage.setItem('ff_final',JSON.stringify(s));
let v=document.querySelector('video');
v.addEventListener('play',()=>{if(v.currentTime<1){s.v++;localStorage.setItem('ff_final',JSON.stringify(s))}});
v.addEventListener('timeupdate',()=>{if(v.duration&&v.currentTime/v.duration>0.95&&!v._c){v._c=1;s.p95++;localStorage.setItem('ff_final',JSON.stringify(s))}});
if(location.search.includes('admin')) document.getElementById('admin').style.display='block';
function upd(){document.getElementById('a1').textContent=s.imp;document.getElementById('a2').textContent=s.v;document.getElementById('a3').textContent=s.p95;document.getElementById('a4').textContent=s.pin}
setInterval(upd,500); upd();
</script>
</body>
</html>
