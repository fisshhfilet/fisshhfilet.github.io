<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FISSHHFILET</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;background:#000;overflow:hidden}
body{position:fixed;inset:0;background:#000}
#intro{position:fixed;inset:0;z-index:30;background:#000;display:flex;align-items:center;justify-content:center;color:#fff;font-family:Menlo,monospace;letter-spacing:.35em;font-size:11px;transition:opacity.8s ease}
#viewport{height:100dvh;width:100vw;overflow:hidden;background:#000}
#track{height:100dvh;width:100vw;will-change:transform;transition:transform 620ms cubic-bezier(.32,.72,0,1)}
.page{height:100dvh;width:100vw;display:flex;align-items:center;justify-content:center;background:#000;position:relative;overflow:hidden}
.page img,.page video{max-width:100vw;max-height:100dvh;width:100%;height:100%;object-fit:contain;display:block;background:#000}
.page video{opacity:0;transform:scale(.97);transition:opacity.6s ease, transform.7s cubic-bezier(.32,.72,0,1)}
.page.active video{opacity:1;transform:scale(1)}
.hot{position:absolute;z-index:5;cursor:pointer;-webkit-tap-highlight-color:rgba(255,255,255,.2)}
/* Pamplemousse bottom icons */
.pam-bar{position:absolute;bottom:0;left:0;right:0;height:12%;display:flex;z-index:6;background:transparent}
.pam-bar a{flex:1}
</style>
</head>
<body>
<div id="intro">@fisshhfilet</div>
<div id="viewport"><div id="track">

<!-- 1 Betty -->
<section class="page"><img src="betty.jpg?v=16"></section>

<!-- 2 Pamplemousse / WAISTA? with real Apple / Spotify / 7-Eleven links -->
<section class="page">
<img src="waista.jpg?v=16">
<div class="pam-bar">
<a class="hot" href="https://music.apple.com" target="_blank" aria-label="Apple Music"></a>
<a class="hot" href="https://open.spotify.com" target="_blank" aria-label="Spotify"></a>
<a class="hot" href="https://www.7-eleven.com" target="_blank" aria-label="7-Eleven"></a>
<a class="hot" href="https://club52vogue.shop" target="_blank" aria-label="Fis"></a>
<a class="hot" href="https://pamplemousse.com" target="_blank" aria-label="Pamplemousse"></a>
</div>
</section>

<!-- 3 Restocking Soon - Instagram cam tag pushes to your IG -->
<section class="page">
<img src="restocking-fisshhfilet.jpg?v=16">
<a class="hot" href="https://www.instagram.com/club52vogue.shop/" target="_blank" style="inset:35% 25% 35% 25%;position:absolute" aria-label="Instagram club52vogue.shop"></a>
</section>

<!-- 4 Sephora -->
<section class="page"><video src="Sephora.mp4?v=16" playsinline preload="auto" loop></video></section>

<!-- 5 Adults Only Beach - SHOP NOW -> club52vogue.shop + FanDuel -->
<section class="page">
<img src="adults-only.jpg?v=16">
<a class="hot" href="https://club52vogue.shop" target="_blank" style="bottom:12%;left:25%;right:25%;height:8%;position:absolute" aria-label="Shop Now club52vogue.shop"></a>
<a class="hot" href="https://www.fanduel.com" target="_blank" style="top:0;left:0;right:0;height:10%;position:absolute" aria-label="FanDuel"></a>
</section>

<!-- 6 Corset WAISTA / RHUDE -->
<section class="page"><video src="RHUDE.mp4?v=16" playsinline preload="auto"></video></section>

<!-- 7 McDonald's WAISTA? -> push to club52vogue.shop + McDonald's -->
<section class="page">
<img src="mc.jpg?v=16">
<a class="hot" href="https://club52vogue.shop" target="_blank" style="inset:0;position:absolute" aria-label="club52vogue.shop"></a>
<a class="hot" href="https://www.mcdonalds.com" target="_blank" style="top:0;left:0;right:0;height:22%;position:absolute" aria-label="McDonalds"></a>
</section>

<!-- 8 Liquid IV -> push to liquid-iv.com -->
<section class="page">
<img src="liquid.jpg?v=16" onerror="this.src='liquid.mp4?v=16'">
<a class="hot" href="https://www.liquid-iv.com" target="_blank" style="inset:0;position:absolute" aria-label="Liquid IV"></a>
</section>

<!-- 9 Kalshi Ad -> push to kalshi.com -->
<section class="page">
<img src="kalshi.jpg?v=16">
<a class="hot" href="https://kalshi.com" target="_blank" style="inset:0;position:absolute" aria-label="Kalshi Trade On Anything"></a>
</section>

<!-- 10 Boat Bear Fisshhfilet hoodie - arrow box -> club52vogue.shop -->
<section class="page">
<img src="boatbear.jpg?v=16">
<a class="hot" href="https://club52vogue.shop" target="_blank" style="top:2%;right:2%;width:18%;height:10%;position:absolute;background:rgba(255,255,255,0)" aria-label="Boat Bear arrow to shop"></a>
<a class="hot" href="https://club52vogue.shop" target="_blank" style="bottom:20%;left:10%;right:10%;height:15%;position:absolute" aria-label="Fisshhfilet Boat Bear Shop"></a>
</section>

<!-- 11 GOMF last -->
<section class="page"><video src="GOMF.mp4?v=16" playsinline preload="auto"></video></section>

</div></div>
<script>
let i=0; const track=document.getElementById('track'); const intro=document.getElementById('intro'); const pages=[...document.querySelectorAll('.page')]; const total=pages.length;
function render(){
 track.style.transform=`translate3d(0,${-i*100}dvh,0)`;
 pages.forEach((p,k)=>{
  p.classList.toggle('active',k===i);
  const v=p.querySelector('video'); if(!v) return;
  if(k===i){ v.currentTime=k===3?0.25:0; v.muted=false; v.volume=1; setTimeout(()=>v.play().catch(()=>{v.muted=true;v.play();}),80);} else v.pause();
 });
}
function next(){ if(i<total-1){i++;render();} }
function prev(){ if(i>0){i--;render();} }
setTimeout(()=>{intro.style.opacity='0'; setTimeout(()=>intro.remove(),800);},1100);
let sy=0; addEventListener('touchstart',e=>{sy=e.touches[0].clientY;},{passive:true});
addEventListener('touchend',e=>{
 if(e.target.closest('a.hot')) return;
 const dy=e.changedTouches[0].clientY-sy;
 if(Math.abs(dy)>45){ dy<0?next():prev(); }
},{passive:true});
render();
</script>
</body>
</html>
