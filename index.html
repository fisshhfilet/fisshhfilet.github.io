<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>FISSHHFILET</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;background:#000;overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;background:#000}
#intro{position:fixed;inset:0;z-index:20;background:#000;display:flex;align-items:center;justify-content:center;color:#fff;font-family:Menlo,monospace;font-size:11px;letter-spacing:.3em;transition:opacity.6s ease}
#viewport{height:100dvh;width:100vw;overflow:hidden;position:relative;background:#000;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#track{height:100dvh;width:100vw;will-change:transform;transition:transform 500ms cubic-bezier(.32,.72,0,1)}
.page{height:100dvh;width:100vw;display:flex;align-items:center;justify-content:center;background:#000;position:relative;overflow:hidden}
.page img,.page video{max-width:100vw;max-height:100dvh;width:100%;height:100%;object-fit:contain;display:block;background:#000}
.restock{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000;color:#fff;text-align:center;gap:18px}
.restock h1{font-family:Helvetica,Arial,sans-serif;font-size:clamp(32px,7vw,64px);font-weight:900;letter-spacing:.06em;line-height:.9}
.restock p{font-family:Menlo,monospace;font-size:12px;letter-spacing:.35em;opacity:.9}
</style>
</head>
<body>
<div id="intro">@fisshhfilet</div>
<div id="viewport">
<div id="track">
<section class="page"><img src="top_10_sources_betty_boop.webp" alt="betty"></section>
<section class="page"><img src="waista.jpg" alt="waista"></section>
<section class="page"><div class="restock"><h1>RESTOCKING<br>SOON</h1><p>DM WAITLIST</p></div></section>
<section class="page"><video src="Sephora.mp4" playsinline muted preload="auto"></video></section>
<section class="page"><img src="adults-only.jpg" alt="adults-only"></section>
<section class="page"><video src="RHUDE.mp4" playsinline muted preload="auto"></video></section>
<section class="page"><video src="GOMF.mp4" playsinline muted preload="auto"></video></section>
</div>
</div>
<script>
let i=0; const pages=document.querySelectorAll('.page'); const track=document.getElementById('track'); const intro=document.getElementById('intro'); const total=pages.length;
function render(){
  track.style.transform='translate3d(0,'+(-i*100)+'dvh,0)';
  pages.forEach((p,k)=>{
    const v=p.querySelector('video');
    if(!v) return;
    if(k===i){ try{v.currentTime=0}catch(e){} v.play().catch(()=>{}); }
    else { v.pause(); try{v.currentTime=0}catch(e){} }
  });
}
function next(){ if(i<total-1){i++; render();} }
function prev(){ if(i>0){i--; render();} }
setTimeout(()=>{intro.style.opacity='0'; setTimeout(()=>intro.remove(),600);},800);
let sy=0,t0=0;
addEventListener('touchstart',e=>{sy=e.touches[0].clientY; t0=Date.now();},{passive:true});
addEventListener('touchend',e=>{
  const dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dy)>48){ dy<0?next():prev(); }
  else if(Date.now()-t0<300){ next(); }
},{passive:true});
addEventListener('click',()=>{ if(Date.now()-t0>400) next(); });
addEventListener('wheel',e=>{ if(Math.abs(e.deltaY)>20){ e.deltaY>0?next():prev(); }},{passive:true});
pages.forEach(p=>{
  const v=p.querySelector('video');
  if(v){ v.addEventListener('ended',()=>{ if(i<total-1) next(); }); }
});
render();
</script>
</body>
</html>
